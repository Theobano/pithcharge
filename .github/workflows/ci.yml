name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pithcharge
          POSTGRES_PASSWORD: pithcharge
          POSTGRES_DB: pithcharge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pithcharge -d pithcharge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pithcharge:pithcharge@localhost:5432/pithcharge
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:4000
      TRUSTED_ORIGINS: http://localhost:3100
      CMS_PROVIDER: mock
      PAYMENT_PROVIDERS: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @pithcharge/db exec prisma generate --config prisma7.config.ts
      - name: Apply migrations
        run: pnpm --filter @pithcharge/db exec prisma migrate deploy --config prisma7.config.ts
      - name: Type-check
        run: pnpm check-types
      - name: Lint
        run: pnpm lint
      - name: BFF tests
        run: pnpm --filter @pithcharge/bff test
      - name: Worker tests
        run: pnpm --filter @pithcharge/worker test
      - name: Build web
        run: pnpm --filter @pithcharge/web build

  docker:
    name: Docker build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        target: [migrate, bff, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
